name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this whole pipeline before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Format & Strict Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Verify Code Formatting
        run: ruff format --check .

      - name: Verify Strict Typing (Mypy)
        run: mypy --strict src

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run zero-dependency test runner (Standard Library)
        run: python tests/run.py

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run test suite via pytest with coverage gate
        run: pytest --cov=aepkit --cov-report=term-missing --cov-fail-under=90

      - name: Verify CLI commands
        shell: bash
        run: |
          aepkit --version
          python -m aepkit --version
          aepkit --help
          aepkit init docs/ci-test --name "CI Smoke Test"
          aepkit lint docs/ci-test
          aepkit status docs/ci-test
          aepkit install-skill docs/ci-test --agent antigravity
          aepkit install-skill docs/ci-test --agent claude
          aepkit install-skill docs/ci-test --agent cursor

  build:
    name: Verify Distribution Package
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check build outputs
        run: |
          ls -lh dist/
          twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/wheel-env/bin/aepkit --version
          /tmp/wheel-env/bin/aepkit init smoke
          /tmp/wheel-env/bin/aepkit lint smoke
          /tmp/wheel-env/bin/aepkit install-skill smoke --agent claude
          test -f smoke/.claude/skills/auditor-executor-protocol/references/handoffs.md
