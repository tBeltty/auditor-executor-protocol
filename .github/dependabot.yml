version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    # The test extras are minimum versions and the dev tools are exact pins. A requirement is
    # only changed when it no longer admits the latest release: pins move on every release,
    # floors only when they must, so updates never drop support for an older Python in CI.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
