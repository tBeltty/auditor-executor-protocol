[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-executor-protocol"
dynamic = ["version"]
description = "Mechanical support for the Auditor/Executor protocol: scaffold, lint, and negative-control the document set for a multi-phase, multi-agent execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tBeltty", email = "jhonatan@tbelt.online" }]
keywords = [
    "audit",
    "executor",
    "ai-agents",
    "llm-protocols",
    "quality-assurance",
    "verification",
    "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tBeltty/auditor-executor-protocol"
Repository = "https://github.com/tBeltty/auditor-executor-protocol"
Issues = "https://github.com/tBeltty/auditor-executor-protocol/issues"
Changelog = "https://github.com/tBeltty/auditor-executor-protocol/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Exact pins, so a new linter rule or build-tool release cannot turn CI red or change a
# published build without a commit; Dependabot bumps them.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "build==1.6.1",
    "twine==7.0.0",
]

[project.scripts]
auditkit = "auditkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "auditkit.__version__" }

[tool.setuptools.package-data]
auditkit = ["templates/*.md", "skill/*.md", "skill/references/*.md", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL", "RUF"]
ignore = [
    "E501",     # Line length violations (handled by ruff format)
    "PLR2004",  # Magic value comparison
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLC0415",  # Import outside top-level
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["auditkit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
